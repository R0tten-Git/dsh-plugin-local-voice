name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check index.js
          node --check client.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: python -m py_compile qwen3_worker.py scripts/prepare_model.py

      - name: Package manifest and tarball
        run: |
          node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name, p.version)"
          npm pack --dry-run
