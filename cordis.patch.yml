# 把内置语音输入的默认识别器换成本机的 Qwen3-ASR（由本包 Host 半部注册）
# 这一层在 @deepseek-ai/dsh-experimental-voice-input-bundle 之后应用，所以能覆盖它写下的
# defaultProvider: sensevoice-local。language 用 auto（Qwen3 自己判语言，中文仍最准）。
- id: speech-to-text
  name: '@deepseek-ai/dsh-experimental-speech-to-text'
  config:
    defaultProvider: qwen3-asr-local
    language: auto
- insert:
    - id: voice-input
      name: 'dsh-plugin-voice-input'
